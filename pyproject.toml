[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dace-fortran"
version = "1.0.0"
description = "Fortran (HLFIR) frontend for the DaCe data-centric framework"
readme = "README.md"
license = "GPL-3.0-or-later"
authors = [
    { name = "ETH Zurich and the dace-fortran authors" }
]
requires-python = ">=3.10, <3.15"
classifiers = [
    "Development Status :: 4 - Beta",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
]
keywords = ["fortran", "flang", "hlfir", "mlir", "dace", "frontend", "dataflow"]

dependencies = [
    # A commit of the FaCe branch, which carries the DaCe-core pieces the frontend needs; a sha keeps CI reproducible.
    "dace @ git+https://github.com/spcl/dace.git@02c40f569f7f07ef7a0f77ed24e2a64ff6d42129",
    # fparser AST single-TU inliner (dace_fortran.fparser_inliner).  >0.2
    # carries the Fortran2003-before-Fortran2008 import ordering needed
    # under Python 3.14 (cf. d-face commit 74110d690).
    "fparser > 0.2",
    "networkx",
    "numpy",
]

[dependency-groups]
testing = [
    "pytest",
    "pytest-cov",
    "pytest-timeout",
    "pytest-xdist",
    "coverage",
    # The bridge is a nanobind extension, built by CMake on first use.
    "nanobind",
    # numpy's f2py uses meson as its build backend on Python >= 3.12; the numerical-reference builds need it
    # (a missing meson fails them). meson also configures the icon-model build.
    "meson",
    "ninja",
]
# mpi4py builds against the system MPI: ``MPICC=mpicc uv sync --group mpi``.
mpi = ["mpi4py"]
# Pinned so a local ``pre-commit run`` agrees with the CI ``format`` job (see .pre-commit-config.yaml).
linting = [
    "pre-commit",
    "ruff==0.14.3",
    "mypy==1.18.2",
    "pyright==1.1.407",
    "fprettify",
    "clang-format~=21.1",
]
dev = [
    { include-group = "testing" },
    { include-group = "linting" },
]

[tool.uv]
default-groups = ["dev"]
# Editable installs as a plain path entry: mypy and pyright cannot follow setuptools' import-hook finders, so an
# editable dace (``uv pip install -e <dace checkout>``) resolves for them only in compat mode.
config-settings = { editable_mode = "compat" }

[project.urls]
Homepage = "https://github.com/spcl/dace-fortran"
Repository = "https://github.com/spcl/dace-fortran"
Documentation = "https://spcldace.readthedocs.io"
Issues = "https://github.com/spcl/dace-fortran/issues"

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/icon/full/icon-model", "tests/cloudsc/variants/dwarf-p-cloudsc"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # The set agreed for dace (Tal): annotations, docstrings, unused arguments, dict(...) calls, magic values.
    "F821", "F841", "ANN", "D", "EM101", "EM102", "ARG", "C408", "PLR2004",
    # Conflict with ruff format.
    "COM812", "E501",
    # Tests assert; scripts print and run subprocesses; error messages are written inline.
    "S", "T201", "TRY003", "TRY300",
    # Lazy imports (fparser, MLIR bridge), private access between our own modules, Fortran-style names.
    "PLC0415", "SLF001", "N8",
    # Size and style heuristics.
    "C901", "PLR0911", "PLR0912", "PLR0913", "PLR0915", "FBT", "TD", "FIX", "ERA001", "PT006", "PT018",
    # Imports stay where annotations read them at runtime; os.path stays; tests and scripts catch broadly.
    "TC", "PTH", "PERF203", "PERF401", "BLE001", "S108", "S110", "S112", "PT011", "PT019",
    # Scripts and stubs are not packages.
    "INP001", "EXE001", "PYI021", "N999",
    # Closures here run inside the iteration that defines them; DaCe config variables are mixed case.
    "B023", "SIM112",
    # Loop variables are rebound on purpose; class-level tables are constants; tests raise blind exceptions.
    "PLW2901", "RUF012", "A001", "B017", "PLC0206",
    # ``Union[...]`` aliases are runtime objects (walk/isinstance targets); package-relative imports stay.
    "UP007", "TID252",
]

[tool.ruff.lint.per-file-ignores]
# Spack recipes star-import the package DSL by spack's own convention.
"spack/**/package.py" = ["F403", "F405"]
# The MPI / stack environment has to be in place before mpi4py and dace are imported.
"tests/conftest.py" = ["E402"]
# Imports the ICON test helpers, which expect tests/ on sys.path.
"scripts/build_icon_solve_nh_libs.py" = ["E402"]

[tool.mypy]
files = ["dace_fortran"]
follow_imports = "silent"

# dace ships no ``py.typed`` marker; analyze its sources instead of treating every dace name as ``Any``.
[[tool.mypy.overrides]]
module = ["dace", "dace.*"]
follow_untyped_imports = true

# fparser ships neither annotations nor a ``py.typed`` marker (``typings/`` stubs it for pyright, whose
# ``type[Base]`` module ``__getattr__`` mypy does not accept in annotations); networkx stubs are not a dependency.
[[tool.mypy.overrides]]
module = ["fparser", "fparser.*", "networkx", "networkx.*"]
ignore_missing_imports = true

[tool.pyright]
include = ["dace_fortran"]
stubPath = "typings"

[tool.setuptools.packages.find]
where = ["."]
include = ["dace_fortran*"]

[tool.setuptools.package-data]
dace_fortran = [
    "CMakeLists.txt",
    "build_bridge.py",
    # Version shims the bridge sources #include; lives at the package root, so it is
    # not covered by the bridge/ and passes/ globs below.
    "llvm_compat.h",
    "bridge/**/*.cpp",
    "bridge/**/*.h",
    "passes/**/*.cpp",
    "passes/**/*.h",
    # Library runtime sources: CMake compiles these into every SDFG that uses the library, so an
    # install that drops them fails the build rather than the import.
    "libraries/**/*.f90",
    "libraries/**/*.h",
    "libraries/**/*.cmake",
    # Binding templates: block_builders.py read_text()s these at runtime; CI never notices a gap
    # here because it installs -e.
    "bindings/templates/*.f90.in",
]

[tool.pytest.ini_options]
markers = [
    "long: Slow test (tens of minutes: ICON built from source, ICON-O / atmosphere single-TU extractions, the full QE h_psi build); the CI heavy lanes run it.",
    "sequential: Test must be run sequentially (select with '-m \"sequential\"')",
    "mpi: Multi-rank MPI test, run under mpirun (select with '-m \"mpi\"')",
    "integration: ICON orig-vs-binding bit-exact integration test (per-call duplicate-data, short run)",
    "e2e: Production kernel through the full parallelization pipeline, built with and without it on seeded inputs: pre- vs post-optimize bit-exact, and against the gfortran/f2py reference",
    "xdist_group: pytest-xdist load-group marker (ICON-build tests share one worker via --dist loadgroup)",
    "fftw: Needs libfftw3 to link the FFT library node's expansion",
    "gpu: Needs an AMD GPU, ROCm amdflang and DaCe's HIP backend; runs in the agent-mi300 container (select with '-m gpu')",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
# Don't recurse into the icon-model submodule -- its own scripts/
# carries an unrelated pytest tree that fails to collect outside
# its own dependency closure.
norecursedirs = ["icon-model", ".git", "*.egg-info", "build", ".dacecache*"]
addopts = "--color=yes"

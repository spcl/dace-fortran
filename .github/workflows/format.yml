name: Format Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-ci') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v7
      with:
        python-version: '3.12'
        enable-cache: true

    - name: Lint (pre-commit, every file)
      run: |
        # The project's locked environment: the package and dace for mypy / pyright, the pinned linters.
        uv sync --frozen --no-default-groups --group linting
        uv run --no-sync pre-commit run --all-files --show-diff-on-failure --color=always

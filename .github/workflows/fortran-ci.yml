name: Fortran Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
  # Single-node MPI: oversubscribe the runner's few cores, ob1 over shared memory, no hwloc GL / UCX probing (both
  # known MPI_Init hangs on CI runners).
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
  OMPI_MCA_pml: "ob1"
  OMPI_MCA_btl: "self,vader"
  UCX_VFS_ENABLE: "n"
  HWLOC_COMPONENTS: "-gl"
  # Large generated stack arrays crash compiled SDFGs at the default stack size.
  OMP_STACKSIZE: "64M"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  DACE_compiler_max_stack_array_size: "65536"
  DACE_compiler_build_type: "Release"

jobs:
  test-fortran:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'no-ci') }}
    # Lanes, each sized to stay under ~45 minutes with warm caches:
    #   fast        every test outside the lanes below (uploads coverage)
    #   e2e         the e2e pipeline tests except CloudSC, the multi-rank mpi tests, the integration tests, QE h_psi
    #   e2e-cloudsc CloudSC through the pipeline, then the CloudSC numerical tests (each a multi-GB -O3 build, so
    #               one at a time: four at once exhaust the runner's memory)
    #   heavy-icon  tests that need ICON configured and built from source (both builds cached)
    #   heavy-src   the remaining long tests, which read the ICON sources only
    strategy:
      fail-fast: false
      matrix:
        llvm: ['21', '22']
        lane: [fast, e2e, e2e-cloudsc, heavy-icon, heavy-src]
    name: test-fortran (llvm${{ matrix.llvm }}, ${{ matrix.lane }})
    runs-on: ubuntu-24.04
    # A cold ICON cache adds two ICON builds to heavy-icon.
    timeout-minutes: ${{ matrix.lane == 'heavy-icon' && 150 || 75 }}
    env:
      LLVM_VERSION: ${{ matrix.llvm }}
      ICON_BUILD: ${{ github.workspace }}/../icon_build/stock_cpu
      PYTEST_OPTS: --maxfail=20 -p no:cacheprovider --tb=short --durations=30
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup
      with:
        llvm: ${{ matrix.llvm }}

    - name: Check out the icon-model submodule
      if: ${{ matrix.lane != 'fast' && matrix.lane != 'e2e-cloudsc' }}
      id: icon-src
      run: |
        git submodule update --init --recursive --depth 1 tests/icon/full/icon-model
        echo "sha=$(git -C tests/icon/full/icon-model rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Restore the ICON builds
      if: ${{ matrix.lane == 'heavy-icon' }}
      id: icon-build
      uses: actions/cache/restore@v4
      with:
        path: |
          tests/icon/dycore/.icon_build
          ${{ github.workspace }}/../icon_build
        key: icon-${{ steps.icon-src.outputs.sha }}-${{ hashFiles('tests/icon/dycore/setup_icon_dycore.sh', 'tests/icon/dycore/config/*', 'tests/icon/full/_icon_build.py') }}

    - name: Build ICON (compile_commands.json for the dycore parse test, the icon_build fixture tree)
      if: ${{ matrix.lane == 'heavy-icon' && steps.icon-build.outputs.cache-hit != 'true' }}
      run: |
        SKIP_APT=1 bash tests/icon/dycore/setup_icon_dycore.sh
        cd tests && python -c "from pathlib import Path; from icon.full._icon_build import ensure_icon_built; \
          ensure_icon_built(Path('icon/full/icon-model'), Path('$ICON_BUILD'))"

    - name: Save the ICON builds
      if: ${{ matrix.lane == 'heavy-icon' && steps.icon-build.outputs.cache-hit != 'true' }}
      uses: actions/cache/save@v4
      with:
        path: |
          tests/icon/dycore/.icon_build
          ${{ github.workspace }}/../icon_build
        key: ${{ steps.icon-build.outputs.cache-primary-key }}

    - name: fast
      if: ${{ matrix.lane == 'fast' }}
      run: |
        ulimit -s 65536
        pytest -n auto --dist loadgroup --max-worker-restart=0 $PYTEST_OPTS \
          -m "not mpi and not long and not integration and not e2e" \
          --ignore=tests/cloudsc/full --ignore=tests/cloudsc/variants --ignore=tests/qe/h_psi \
          --timeout=300 --timeout-method=thread -o faulthandler_timeout=420 \
          --cov-report=xml --cov=dace_fortran tests/
        curl -Os https://uploader.codecov.io/latest/linux/codecov && chmod +x codecov && ./codecov || true

    - name: e2e -- multi-rank mpi tests
      if: ${{ matrix.lane == 'e2e' }}
      run: mpirun --oversubscribe -n 4 python -m pytest -m mpi $PYTEST_OPTS tests/

    - name: e2e -- integration tests
      if: ${{ matrix.lane == 'e2e' }}
      run: python -m pytest -m "integration and not mpi" $PYTEST_OPTS tests/

    - name: e2e -- pipeline tests (QE vexx, ICON velocity_tendencies)
      if: ${{ matrix.lane == 'e2e' }}
      # Sequential: each -O3 build of a production kernel peaks at several GB.
      run: python -m pytest -m "e2e and not mpi" --ignore=tests/e2e/test_cloudsc.py $PYTEST_OPTS tests/

    - name: e2e -- QE h_psi
      if: ${{ matrix.lane == 'e2e' }}
      run: python -m pytest -m "not mpi and not long and not integration and not e2e" $PYTEST_OPTS tests/qe/h_psi

    - name: e2e-cloudsc
      if: ${{ matrix.lane == 'e2e-cloudsc' }}
      run: python -m pytest -m e2e $PYTEST_OPTS tests/e2e/test_cloudsc.py

    - name: e2e-cloudsc -- CloudSC numerical tests
      if: ${{ matrix.lane == 'e2e-cloudsc' }}
      run: |
        ulimit -s 65536
        python -m pytest -m "not mpi and not long and not integration and not e2e" $PYTEST_OPTS \
          --timeout=1800 --timeout-method=thread tests/cloudsc/full tests/cloudsc/variants

    - name: heavy-icon
      if: ${{ matrix.lane == 'heavy-icon' }}
      run: pytest -n auto --dist loadgroup -m "long and icon_build and not mpi and not integration and not e2e" $PYTEST_OPTS tests/

    - name: heavy-src
      if: ${{ matrix.lane == 'heavy-src' }}
      run: pytest -n auto --dist loadgroup -m "long and not icon_build and not mpi and not integration and not e2e" $PYTEST_OPTS tests/

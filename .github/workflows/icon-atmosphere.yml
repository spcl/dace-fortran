name: ICON Atmosphere solve_nh integration

# Replaces ICON's solve_nh dycore with the DaCe-generated binding and runs a short EXCLAIM aquaplanet R02B04
# experiment against stock ICON (llvm22). Manual until it has passed once.
on:
  workflow_dispatch:

env:
  OMPI_MCA_rmaps_base_oversubscribe: "1"
  PRTE_MCA_rmaps_default_mapping_policy: ":oversubscribe"
  OMPI_MCA_pml: "ob1"
  OMPI_MCA_btl: "self,vader"
  UCX_VFS_ENABLE: "n"
  HWLOC_COMPONENTS: "-gl"
  OMP_STACKSIZE: "64M"
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  DACE_compiler_max_stack_array_size: "65536"
  DACE_compiler_build_type: "Release"

jobs:
  icon-atmosphere-solve-nh:
    name: ICON atmosphere solve_nh dace-fortran (llvm22)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      LLVM_VERSION: "22"
    steps:
    - uses: actions/checkout@v4

    - uses: ./.github/actions/setup
      with:
        llvm: "22"

    - name: Check out the icon-model submodule
      run: git submodule update --init --recursive --depth 1 tests/icon/full/icon-model

    - name: Run solve_nh ICON atmosphere e2e
      run: |
        python -m scripts.run_icon_solve_nh_atmosphere_e2e \
          --icon-src tests/icon/full/icon-model \
          --work-dir "${RUNNER_TEMP}/solve_nh_atmosphere_e2e" \
          --nranks 2 \
          --jobs 2

    - name: Upload logs and artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: icon-atmosphere-solve-nh-logs-${{ github.run_id }}
        path: |
          ${{ runner.temp }}/solve_nh_atmosphere_e2e/*/icon_run.*.log
          ${{ runner.temp }}/solve_nh_atmosphere_e2e/solve_nh_dace_libs/**/*.f90
        if-no-files-found: ignore

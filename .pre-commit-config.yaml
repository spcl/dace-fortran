default_language_version:
  python: python3

# Vendored upstream trees (the ICON submodule, dwarf-p-cloudsc under Apache-2.0, see NOTICE) are never ours to
# reformat or lint.
exclude: '^tests/(icon/full/icon-model|cloudsc/variants/dwarf-p-cloudsc)/'

repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v5.0.0
  hooks:
  - id: check-merge-conflict
  - id: check-yaml
  # The committed .f90 single-TU fixtures are byte-compared against fresh inliner output, and .patch context lines
  # carry significant whitespace: a whitespace hook must never mutate either.
  - id: end-of-file-fixer
    exclude: '\.(f90|F90|patch)$'
  - id: trailing-whitespace
    exclude: '\.(f90|F90|patch)$'

# The linters run in the project's uv environment as it is (``uv sync`` first; ``--no-sync`` keeps an editable dace
# installed over the locked one), so their versions come from uv.lock and mypy / pyright resolve the installed dace.
- repo: local
  hooks:
  - id: ruff-check
    name: ruff check
    entry: uv run --no-sync ruff check --force-exclude
    language: system
    types_or: [python, pyi]
  - id: ruff-format
    name: ruff format
    entry: uv run --no-sync ruff format --force-exclude
    language: system
    types_or: [python, pyi]
  - id: mypy
    name: mypy (dace_fortran)
    entry: uv run --no-sync mypy
    language: system
    pass_filenames: false
    files: '^(dace_fortran/.*\.py|typings/.*\.pyi|pyproject\.toml)$'
  - id: pyright
    name: pyright (dace_fortran, warnings are errors)
    entry: uv run --no-sync pyright --warnings
    language: system
    pass_filenames: false
    files: '^(dace_fortran/.*\.py|typings/.*\.pyi|pyproject\.toml)$'
  - id: clang-format
    name: clang-format
    entry: uv run --no-sync clang-format -i
    language: system
    files: '\.(cpp|h)$'
  # Every .f90 under tests/ is a drift-guarded generated fixture or a deliberately shaped parser/bridge test vector.
  - id: fprettify
    name: fprettify
    entry: uv run --no-sync fprettify -c .fprettify.rc
    language: system
    files: '\.(f90|F90)$'
    exclude: '^tests/'
  - id: dace-fortran-headers
    name: copyright / SPDX header (core package)
    entry: uv run --no-sync python scripts/check_headers.py --fix
    language: system
    require_serial: true
    files: '\.py$'
  - id: dace-fortran-large-files
    name: block files > 500 KiB
    entry: uv run --no-sync python scripts/check_large_files.py
    language: system
